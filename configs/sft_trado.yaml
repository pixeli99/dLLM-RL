wandb:
  entity: null
  resume: 'auto'


experiment:
    project: "sft_trado" # need to be same of this file name 
    num_node: 1 # the number of machines you have


model:
    pretrained_model: "Gen-Verse/TraDo-8B-Instruct" # absolute path of your model
    optimized_name: "optimized" # the output name for your optimized model, will be saved under sft_sdar/trado



# sft dataset
dataset:
    optimization_data: "sft_math8k" # processed by data/prepare_think_sft.py

training:
    gradient_checkpointing_enable: True # MUST be True for such long sequences
    gradient_accumulation_steps: 1 # Increased for better gradient stability
    batch_size_lm: 8 # Keep at 1 due to long sequences
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 10086
    num_train_epochs: 2
    max_grad_norm: 1
    method: "semi-ar" # "semi-ar""trace"
    lower_p: 0.1
    upper_p: 0.9
    block_size: 256 # the block size of your model
    shrink: 1
    post_num: 0 # number of pad token need to be trained for each data point
    max_gen_length: 2048
    max_prompt_len: 512



optimizer:
    name: adamw
    params: # default adamw params
        learning_rate: 1e-5
        scale_lr: False # scale learning rate by total batch size
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.0
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 0
        min_lr_scale: 1.0

tokenizer:
    additional_special_tokens:
      - '<think 1>'
      - '</think 1>'
      - '<think 2>'
      - '</think 2>'
      - '<think 3>'
      - '</think 3>'
      - '<summary>'
      - '</summary>'
      - '<delete>'

